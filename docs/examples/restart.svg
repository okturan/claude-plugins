<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">restart · relaunch command</title>
  <desc id="desc">A real run of the restart plugin's argument rewriter on three sample launch lines.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1c1917" flood-opacity="0.14" />
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #226554; font-size: 12px; font-weight: 750; letter-spacing: 1.4px; }
      .title { fill: #1c1917; font-size: 31px; font-weight: 700; letter-spacing: -0.35px; }
      .subtitle { fill: #57534e; font-size: 15px; }
      .terminal { fill: #d8dee9; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
      .prompt { fill: #a7c080; font-weight: 650; }
      .heading { fill: #d3c6aa; font-weight: 700; }
      .output { fill: #d8dee9; }
      .good, .plus { fill: #a7c080; }
      .warn { fill: #dbbc7f; }
      .bad, .minus { fill: #e67e80; }
      .muted { fill: #859289; }
      .footer { fill: #78716c; font-size: 12px; }
      .footer-code { fill: #78716c; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    </style>
  </defs>
  <rect width="1080" height="600" fill="#f4f1ea" />
  <text x="48" y="34" class="eyebrow">REPRODUCIBLE EVIDENCE</text>
  <text x="48" y="74" class="title">restart · relaunch command</text>
  <text x="48" y="101" class="subtitle">Three launch lines as ps reports them, rebuilt by the plugin's relaunch.ts</text>
  <g filter="url(#shadow)">
    <rect x="48" y="126" width="984" height="396" rx="9" fill="#151b1a" />
    <path d="M48 135a9 9 0 0 1 9-9h966a9 9 0 0 1 9 9v28H48z" fill="#202725" />
    <circle cx="70" cy="145" r="5" fill="#e67e80" />
    <circle cx="88" cy="145" r="5" fill="#dbbc7f" />
    <circle cx="106" cy="145" r="5" fill="#a7c080" />
    <text x="540" y="150" text-anchor="middle" class="footer-code">captured output</text>
    <text x="70" y="184" class="terminal muted"># white: launch line as ps reports it</text>
    <text x="70" y="207" class="terminal muted"># green: command /restart types into the herdr pane</text>
    <text x="70" y="253" class="terminal output">.../versions/2.1.287 --dangerously-skip-permissions --resume old-name</text>
    <text x="70" y="276" class="terminal good">claude --dangerously-skip-permissions --resume 3f16a0e2-07d4-4d6f-9c7d-242450e38448</text>
    <text x="70" y="322" class="terminal output">claude --permission-mode=acceptEdits -c</text>
    <text x="70" y="345" class="terminal good">claude --permission-mode=acceptEdits --resume 3f16a0e2-07d4-4d6f-9c7d-242450e38448</text>
    <text x="70" y="391" class="terminal output">claude --chrome --model claude-opus-5-5[1m] fix the flaky test</text>
    <text x="70" y="414" class="terminal good">claude --chrome --model 'claude-opus-5-5[1m]' --resume 3f16a0e2-07d4-4d6f-9c7d-242450e38448</text>
    <text x="70" y="460" class="terminal warn">Dropped: the old --resume target, -c, and the prompt. Kept: the other launch flags.</text>
  </g>
  <text x="48" y="562" class="footer">Live output of plugins/restart/hooks/relaunch.ts · version path shortened</text>
  <text x="1032" y="562" text-anchor="end" class="footer-code">node scripts/render-plugin-examples.mjs --check</text>
</svg>
